<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Shot Timer · Special Pie</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --text: #e8eaf0; --muted: #8b93a5; --accent: #ff8a1f; --ok: #3ccf7a;
    --warn: #f2c94c; --err: #ff5d5d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%; }
  body { padding: env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 24px); }
  .num { font-variant-numeric: tabular-nums; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 0; position: sticky; top: 0;
    background: var(--bg); z-index: 5; }
  header h1 { font-size: 17px; margin: 0; flex: 1; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.connected { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.connecting { background: var(--warn); animation: blink 1s infinite; }
  .dot.disconnected { background: var(--err); }
  @keyframes blink { 50% { opacity: .3; } }
  #statusText { color: var(--muted); font-size: 13px; }
  button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }
  button.danger { color: var(--err); }
  button.small { padding: 4px 10px; font-size: 14px; }
  button:active { transform: scale(.97); }
  .banner { background: #3a2a12; border: 1px solid #6b4a1a; color: #ffd9a8; padding: 12px; border-radius: 12px;
    margin-bottom: 12px; font-size: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  #big { font-size: 72px; font-weight: 700; text-align: center; letter-spacing: -1px; line-height: 1; margin: 8px 0 4px; }
  #big.flash { color: var(--accent); }
  #bigLabel { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .stat { background: var(--panel2); border-radius: 10px; padding: 8px 4px; text-align: center; }
  .stat b { display: block; font-size: 20px; }
  .stat span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; }
  td:first-child, th:first-child { text-align: left; color: var(--muted); }
  tr.best td.split { color: var(--ok); font-weight: 600; }
  tr.latest td { color: var(--accent); }
  h2 { font-size: 15px; margin: 18px 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .6px;
    display: flex; align-items: center; gap: 8px; }
  h2 .grow { flex: 1; }
  .sess-head { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .sess-head .t { flex: 1; }
  .sess-head .t small { color: var(--muted); display: block; font-size: 12px; }
  .sess-sum { color: var(--muted); font-size: 13px; text-align: right; }
  .sess-body { margin-top: 10px; display: none; }
  .open .sess-body { display: block; }
  .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  input[type=text] { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 10px; flex: 1; min-width: 0; }
  .empty { color: var(--muted); text-align: center; padding: 18px 0; font-size: 14px; }
  details { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; margin-top: 18px; }
  summary { color: var(--muted); cursor: pointer; }
  #log { font: 11px/1.45 ui-monospace, Menlo, monospace; max-height: 340px; overflow: auto; margin-top: 10px;
    white-space: pre-wrap; word-break: break-all; }
  #log .ok { color: var(--ok); } #log .warn { color: var(--warn); } #log .err { color: var(--err); } #log .rx { color: #7fb3ff; }
  textarea { width: 100%; min-height: 120px; background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; font: 12px ui-monospace, Menlo, monospace; padding: 8px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>Shot Timer <span id="statusText">offline</span></h1>
  <button id="btnConnect" class="primary">Connect</button>
</header>

<div id="jsErr" class="banner" style="background:#3a1414;border-color:#7a2a2a;color:#ffb3b3" hidden></div>
<script>
window.addEventListener('error', function (e) {
  var el = document.getElementById('jsErr');
  if (!el) return;
  el.hidden = false;
  el.textContent += 'JS error: ' + (e.message || e) + (e.lineno ? ' (line ' + e.lineno + ':' + e.colno + ')' : '') + '\n';
  el.style.whiteSpace = 'pre-wrap';
});
window.addEventListener('unhandledrejection', function (e) {
  var el = document.getElementById('jsErr');
  if (!el) return;
  el.hidden = false;
  el.textContent += 'Promise error: ' + (e.reason && e.reason.message || e.reason) + '\n';
});
</script>
<div id="noBle" class="banner" hidden>
  This browser has no Web Bluetooth. On iPhone: open this page in <b>Bluefy – Web BLE Browser</b>, or enable the <b>beacio</b> extension in Safari for this site (aA → beacio → Always Allow).
</div>

<section class="card" id="live">
  <div id="big" class="num">0.00</div>
  <div id="bigLabel">waiting for the timer</div>
  <div class="stats">
    <div class="stat"><b class="num" id="sShots">0</b><span>Shots</span></div>
    <div class="stat"><b class="num" id="sFirst">—</b><span>First</span></div>
    <div class="stat"><b class="num" id="sSplit">—</b><span>Split</span></div>
    <div class="stat"><b class="num" id="sBest">—</b><span>Best</span></div>
  </div>
  <table class="num" id="liveTable"><thead><tr><th>#</th><th>Time</th><th>Split</th></tr></thead><tbody></tbody></table>
  <div class="row">
    <input type="text" id="liveNote" placeholder="Note for this string (drill, distance…)">
  </div>
</section>

<h2><span class="grow">History</span>
  <button class="small" id="btnExport">Export CSV</button>
</h2>
<div id="history"></div>
<textarea id="exportBox" hidden readonly></textarea>

<details id="debug" open>
  <summary>Debug</summary>
  <div class="row">
    <button class="small" id="btnConnectAll">Connect (show all devices)</button>
    <button class="small" id="btnDisconnect">Disconnect</button>
    <button class="small" id="btnDemo">Inject test string</button>
    <button class="small" id="btnCopyLog">Copy log</button>
  </div>
  <div class="row">
    <input type="text" id="hexIn" placeholder="Feed raw hex, e.g. F8 F9 36 00 01 23 00 00 F9 F8">
    <button class="small" id="btnFeed">Feed</button>
  </div>
  <div id="log"></div>
</details>

<script>
(function () {
'use strict';

// Protocol per github.com/jkesseler/sg-timer-led-display docs/timer-protocols/special-pie-ble.md
const UUID = {
  timerSvc: '0000fff0-0000-1000-8000-00805f9b34fb',
  infoSvc: '0917fe11-5d37-816d-8000-00805f9b34fb',
};
const OPTIONAL_SERVICES = [
  UUID.timerSvc,
  UUID.infoSvc,
  '0000ffe0-0000-1000-8000-00805f9b34fb',
  '0000180a-0000-1000-8000-00805f9b34fb',
  '0000180f-0000-1000-8000-00805f9b34fb',
  '6e400001-b5a3-f393-e0a9-e50e24dcca9e',
];
const FRAME_LEN = { 0x36: 10, 0x34: 6, 0x18: 6 };
const STORE_KEY = 'sp-timer-sessions-v1';

const $ = (s) => document.querySelector(s);
// Bluefy and the beacio (ex-WebBLE) Safari extension expose navigator.bluetooth;
// beacio also has navigator.beacio, older WebBLE builds navigator.webble
const getBle = () => navigator.bluetooth || navigator.beacio || navigator.webble || null;
const bleName = () => (navigator.bluetooth ? 'navigator.bluetooth' : navigator.beacio ? 'navigator.beacio' : 'navigator.webble');
const state = {
  device: null, sessions: [], current: null, rx: [],
  userDisconnect: false, reconnectTries: 0, openIds: new Set(), wakeLock: null,
};

// ---------- utils ----------
const hex = (b) => Array.from(b, (x) => x.toString(16).padStart(2, '0')).join(' ').toUpperCase();
const ascii = (b) => Array.from(b, (x) => (x >= 32 && x < 127 ? String.fromCharCode(x) : '.')).join('');
const fmt = (ms) => (ms == null ? '—' : (ms / 1000).toFixed(2));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shortUuid = (u) => (/^0000([0-9a-f]{4})-0000-1000-8000-00805f9b34fb$/.test(u) ? u.slice(4, 8).toUpperCase() : u);

function log(msg, cls = '') {
  const el = $('#log');
  const line = document.createElement('div');
  line.className = cls;
  line.textContent = new Date().toLocaleTimeString([], { hour12: false }) + '  ' + msg;
  el.prepend(line);
  while (el.childNodes.length > 500) el.lastChild.remove();
}

function setStatus(s, text) {
  $('#dot').className = 'dot ' + s;
  $('#statusText').textContent = text || s;
  $('#btnConnect').textContent = s === 'connected' ? 'Connected' : 'Connect';
}

// ---------- storage ----------
function loadSessions() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    state.sessions = raw ? JSON.parse(raw) : [];
  } catch (e) {
    state.sessions = [];
    log('Storage unavailable: ' + e.message, 'warn');
  }
}
function saveSessions() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state.sessions)); }
  catch (e) { log('Save failed: ' + e.message, 'warn'); }
}

// ---------- session model ----------
function stats(s) {
  const shots = s.shots;
  const splits = shots.map((x, i) => (i === 0 ? null : x.ms - shots[i - 1].ms)).filter((v) => v != null);
  return {
    n: shots.length,
    first: shots.length ? shots[0].ms : null,
    total: shots.length ? shots[shots.length - 1].ms : null,
    last: splits.length ? splits[splits.length - 1] : null,
    best: splits.length ? Math.min(...splits) : null,
    avg: splits.length ? Math.round(splits.reduce((a, b) => a + b, 0) / splits.length) : null,
  };
}

function newSession(timerId) {
  const s = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    timerId: timerId == null ? null : timerId, startedAt: new Date().toISOString(), endedAt: null, shots: [], note: '',
  };
  state.sessions.unshift(s);
  state.current = s;
  $('#liveNote').value = '';
  return s;
}

function closeCurrent() {
  const s = state.current;
  if (!s) return;
  if (!s.endedAt) s.endedAt = new Date().toISOString();
  if (!s.shots.length) state.sessions = state.sessions.filter((x) => x !== s);
}

function onStart(timerId) {
  const s = state.current;
  if (s && !s.endedAt && !s.shots.length) {
    s.timerId = timerId; s.startedAt = new Date().toISOString();
  } else {
    closeCurrent();
    newSession(timerId);
  }
  log('START string #' + timerId, 'ok');
  saveSessions(); render();
  $('#bigLabel').textContent = 'string started';
}

function onShot(idx, ms, timerId) {
  let s = state.current;
  if (!s || s.endedAt) {
    s = newSession(timerId);
    log('Shot without START, opened a new string', 'warn');
  } else if (s.timerId != null && timerId != null && s.timerId !== timerId && s.shots.length) {
    closeCurrent(); s = newSession(timerId);
    log('String id changed, opened a new string', 'warn');
  }
  const ex = s.shots.find((x) => x.i === idx);
  if (ex && ex.ms === ms) return;            // duplicate notification
  if (ex && idx === 0) {                     // index restarted: new string
    closeCurrent(); s = newSession(null);
  }
  const again = s.shots.find((x) => x.i === idx);
  if (again) again.ms = ms; else s.shots.push({ i: idx, ms });
  s.shots.sort((a, b) => a.i - b.i);
  log('SHOT #' + (idx + 1) + '  ' + fmt(ms), 'ok');
  saveSessions(); render(true);
}

function onStop(timerId) {
  log('STOP string #' + timerId, 'ok');
  closeCurrent();
  saveSessions(); render();
  $('#bigLabel').textContent = 'string stopped';
}

// ---------- frame parser ----------
function feed(bytes) {
  let buf = state.rx.concat(Array.from(bytes));
  for (;;) {
    let s = -1;
    for (let i = 0; i < buf.length - 1; i++) if (buf[i] === 0xF8 && buf[i + 1] === 0xF9) { s = i; break; }
    if (s < 0) { state.rx = buf.length && buf[buf.length - 1] === 0xF8 ? [0xF8] : []; return; }
    if (s > 0) { log('Skipped ' + s + ' byte(s): ' + hex(buf.slice(0, s)), 'warn'); buf = buf.slice(s); }
    if (buf.length < 3) { state.rx = buf; return; }
    const known = FRAME_LEN[buf[2]];
    let len = -1;
    if (known && buf.length >= known && buf[known - 2] === 0xF9 && buf[known - 1] === 0xF8) len = known;
    else if (known && buf.length < known) { state.rx = buf; return; }
    else {
      for (let i = 3; i < buf.length - 1; i++) if (buf[i] === 0xF9 && buf[i + 1] === 0xF8) { len = i + 2; break; }
      if (len < 0) {
        if (buf.length > 64) { log('Parser buffer overflow, reset', 'warn'); state.rx = []; } else state.rx = buf;
        return;
      }
    }
    handleFrame(buf.slice(0, len));
    buf = buf.slice(len);
  }
}

function handleFrame(f) {
  const type = f[2];
  if (type === 0x34) onStart(f[3]);
  else if (type === 0x36 && f.length >= 10) {
    // M1A2+ fw 1.2.0: [3]=? (0 so far) [4]=seconds [5]=centiseconds [6]=shot number (1-based) [7]=string id
    if (f[3] !== 0) log('Note: shot byte3 = 0x' + f[3].toString(16) + ' (unknown field)', 'warn');
    onShot(f[6] - 1, f[4] * 1000 + f[5] * 10, f[7]);
  } else if (type === 0x18) onStop(f[3]);
  else if (type === 0x70 || type === 0x71) log('Info frame 0x' + type.toString(16) + ': "' + ascii(f.slice(4, -2)) + '"');
  else log('Unknown frame type 0x' + type.toString(16).toUpperCase() + ': ' + hex(f), 'warn');
}

// ---------- BLE ----------
function onNotify(e) {
  const v = e.target.value;
  const b = new Uint8Array(v.buffer, v.byteOffset, v.byteLength);
  log('RX ' + shortUuid(e.target.uuid) + ': ' + hex(b), 'rx');
  feed(b);
}

async function connect(acceptAll) {
  const ble = getBle();
  if (!ble) { $('#noBle').hidden = false; return; }
  if (state.device && state.device.gatt.connected) return;
  try {
    const opts = acceptAll
      ? { acceptAllDevices: true, optionalServices: OPTIONAL_SERVICES }
      : {
          filters: [{ services: [UUID.timerSvc] }, { namePrefix: 'SP' }, { namePrefix: 'M1A2' }, { namePrefix: 'Special' }],
          optionalServices: OPTIONAL_SERVICES,
        };
    log('Requesting device (' + (acceptAll ? 'all devices' : 'filtered') + ')…');
    setStatus('connecting', 'searching…');
    const hint = setTimeout(() => {
      log('No device picker after 15 s. Check: iOS Settings → Privacy & Security → Bluetooth → Bluefy is ON, Bluetooth is on, timer is on.', 'err');
      setStatus('', 'no picker');
    }, 15000);
    let dev;
    try { dev = await ble.requestDevice(opts); } finally { clearTimeout(hint); }
    state.device = dev;
    state.userDisconnect = false;
    dev.addEventListener('gattserverdisconnected', onDisconnected);
    log('Selected: ' + (dev.name || '(no name)') + '  id=' + dev.id);
    await openGatt();
  } catch (e) {
    log('Connect failed: ' + e.message, 'err');
    setStatus(state.device && state.device.gatt.connected ? 'connected' : '', 'offline');
  }
}

async function openGatt() {
  setStatus('connecting', 'connecting…');
  const server = await state.device.gatt.connect();
  let services = [];
  try { services = await server.getPrimaryServices(); }
  catch (e) { log('getPrimaryServices: ' + e.message, 'warn'); }
  let subs = 0;
  for (const svc of services) {
    log('Service ' + shortUuid(svc.uuid));
    let chars = [];
    try { chars = await svc.getCharacteristics(); }
    catch (e) { log('  characteristics: ' + e.message, 'warn'); continue; }
    for (const ch of chars) {
      const p = ch.properties;
      const flags = ['read', 'write', 'writeWithoutResponse', 'notify', 'indicate'].filter((k) => p[k]).join(',');
      log('  Char ' + shortUuid(ch.uuid) + ' [' + flags + ']');
      if (p.read) {
        try {
          const v = await ch.readValue();
          const b = new Uint8Array(v.buffer, v.byteOffset, v.byteLength);
          log('    read: ' + hex(b) + '  "' + ascii(b) + '"');
        } catch (e) { log('    read failed: ' + e.message, 'warn'); }
      }
      if (p.notify || p.indicate) {
        try {
          ch.addEventListener('characteristicvaluechanged', onNotify);
          await ch.startNotifications();
          subs++;
          log('    subscribed', 'ok');
        } catch (e) { log('    subscribe failed: ' + e.message, 'warn'); }
      }
    }
  }
  if (!subs) log('No notify characteristics. Try "Connect (show all devices)" and send me this log.', 'err');
  state.reconnectTries = 0;
  setStatus('connected', state.device.name || 'connected');
  keepAwake();
}

function onDisconnected() {
  log('Disconnected', 'warn');
  setStatus('disconnected', 'disconnected');
  if (state.userDisconnect || !state.device) return;
  if (state.reconnectTries >= 6) { log('Giving up reconnecting. Tap Connect.', 'err'); return; }
  const delay = 1000 * ++state.reconnectTries;
  log('Reconnecting in ' + delay / 1000 + ' s (try ' + state.reconnectTries + ')');
  setTimeout(async () => {
    if (state.userDisconnect || state.device.gatt.connected) return;
    try { await openGatt(); } catch (e) { log('Reconnect failed: ' + e.message, 'warn'); onDisconnected(); }
  }, delay);
}

function disconnect() {
  state.userDisconnect = true;
  if (state.device && state.device.gatt.connected) state.device.gatt.disconnect();
  setStatus('', 'offline');
}

async function keepAwake() {
  try { if ('wakeLock' in navigator) state.wakeLock = await navigator.wakeLock.request('screen'); }
  catch (e) { /* not supported in this browser */ }
}

// ---------- rendering ----------
function shotRows(s, latestFirst) {
  const st = stats(s);
  const rows = s.shots.map((x, i) => {
    const split = i === 0 ? x.ms : x.ms - s.shots[i - 1].ms;
    const best = i > 0 && split === st.best && s.shots.length > 2;
    return { i: x.i, ms: x.ms, split, best, latest: i === s.shots.length - 1 };
  });
  if (latestFirst) rows.reverse();
  return rows.map((r) =>
    `<tr class="${r.best ? 'best' : ''} ${latestFirst && r.latest ? 'latest' : ''}"><td>${r.i + 1}</td><td>${fmt(r.ms)}</td><td class="split">${fmt(r.split)}</td></tr>`
  ).join('');
}

function renderLive(flash) {
  const s = state.current || state.sessions[0] || null;
  const big = $('#big');
  if (!s) {
    big.textContent = '0.00';
    ['#sShots', '#sFirst', '#sSplit', '#sBest'].forEach((id, k) => ($(id).textContent = k ? '—' : '0'));
    $('#liveTable tbody').innerHTML = '';
    return;
  }
  const st = stats(s);
  big.textContent = fmt(st.total == null ? 0 : st.total);
  $('#sShots').textContent = st.n;
  $('#sFirst').textContent = fmt(st.first);
  $('#sSplit').textContent = fmt(st.last);
  $('#sBest').textContent = fmt(st.best);
  $('#liveTable tbody').innerHTML = shotRows(s, true);
  if (document.activeElement !== $('#liveNote')) $('#liveNote').value = s.note || '';
  if (flash) {
    $('#bigLabel').textContent = 'shot ' + st.n;
    big.classList.add('flash');
    clearTimeout(renderLive.t);
    renderLive.t = setTimeout(() => big.classList.remove('flash'), 350);
  }
}

function renderHistory() {
  const el = $('#history');
  const list = state.sessions.filter((s) => s.shots.length);
  if (!list.length) { el.innerHTML = '<div class="empty">No strings yet</div>'; return; }
  el.innerHTML = list.map((s) => {
    const st = stats(s);
    const d = new Date(s.startedAt);
    const when = d.toLocaleDateString([], { day: '2-digit', month: 'short' }) + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    const live = s === state.current && !s.endedAt ? ' · live' : '';
    return `<div class="card ${state.openIds.has(s.id) ? 'open' : ''}" data-id="${s.id}">
      <div class="sess-head" data-act="toggle">
        <div class="t">${s.note ? esc(s.note) : 'String'}${live}<small>${when}</small></div>
        <div class="sess-sum num">${st.n} shots · ${fmt(st.total)} s<br>first ${fmt(st.first)} · best ${fmt(st.best)}</div>
      </div>
      <div class="sess-body">
        <table class="num"><thead><tr><th>#</th><th>Time</th><th>Split</th></tr></thead><tbody>${shotRows(s, false)}</tbody></table>
        <div class="sess-sum num" style="margin-top:6px">avg split ${fmt(st.avg)}</div>
        <div class="row">
          <input type="text" data-act="note" value="${esc(s.note || '')}" placeholder="Note">
          <button class="small danger" data-act="del">Delete</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function render(flash) { renderLive(flash); renderHistory(); }

// ---------- export ----------
function toCsv() {
  const lines = ['started_at,note,shot,time_s,split_s'];
  for (const s of state.sessions.slice().reverse()) {
    s.shots.forEach((x, i) => {
      const split = i === 0 ? x.ms : x.ms - s.shots[i - 1].ms;
      lines.push([s.startedAt, '"' + (s.note || '').replace(/"/g, '""') + '"', x.i + 1, fmt(x.ms), fmt(split)].join(','));
    });
  }
  return lines.join('\n');
}

async function exportCsv() {
  const csv = toCsv();
  const name = 'shot-timer-' + new Date().toISOString().slice(0, 10) + '.csv';
  try {
    const file = new File([csv], name, { type: 'text/csv' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(csv); log('CSV copied to clipboard', 'ok'); } catch (e) { /* fall through */ }
  const box = $('#exportBox');
  box.hidden = false; box.value = csv; box.focus(); box.select();
}

// ---------- demo ----------
function demo() {
  const frames = [];
  const id = Math.floor(Math.random() * 200);
  frames.push([0xF8, 0xF9, 0x34, id, 0xF9, 0xF8]);
  let t = 1100 + Math.floor(Math.random() * 400);
  for (let i = 0; i < 6; i++) {
    frames.push([0xF8, 0xF9, 0x36, 0x00, Math.floor(t / 1000), Math.floor((t % 1000) / 10), i + 1, id, 0xF9, 0xF8]);
    t += 180 + Math.floor(Math.random() * 160);
  }
  frames.push([0xF8, 0xF9, 0x18, id, 0xF9, 0xF8]);
  frames.forEach((f, k) => setTimeout(() => { log('DEMO ' + hex(f), 'rx'); feed(f); }, k * 300));
}

// ---------- wiring ----------
$('#btnConnect').onclick = () => { log('Connect tapped'); connect(false); };
$('#btnConnectAll').onclick = () => connect(true);
$('#btnDisconnect').onclick = disconnect;
$('#btnDemo').onclick = demo;
$('#btnExport').onclick = exportCsv;
$('#btnFeed').onclick = () => {
  const bytes = ($('#hexIn').value.match(/[0-9a-fA-F]{2}/g) || []).map((h) => parseInt(h, 16));
  if (bytes.length) { log('FEED ' + hex(bytes), 'rx'); feed(bytes); }
};
$('#btnCopyLog').onclick = async () => {
  const text = Array.from($('#log').childNodes).reverse().map((n) => n.textContent).join('\n');
  try { await navigator.clipboard.writeText(text); log('Log copied', 'ok'); }
  catch (e) { const box = $('#exportBox'); box.hidden = false; box.value = text; box.select(); }
};
$('#liveNote').addEventListener('input', (e) => {
  const s = state.current || state.sessions[0];
  if (!s) return;
  s.note = e.target.value; saveSessions(); renderHistory();
});
$('#history').addEventListener('click', (e) => {
  const card = e.target.closest('[data-id]');
  if (!card) return;
  const id = card.dataset.id;
  const act = (e.target.closest('[data-act]') || { dataset: {} }).dataset.act;
  if (act === 'toggle') {
    state.openIds.has(id) ? state.openIds.delete(id) : state.openIds.add(id);
    card.classList.toggle('open');
  } else if (act === 'del') {
    const btn = e.target;
    if (btn.dataset.armed) {
      state.sessions = state.sessions.filter((s) => s.id !== id);
      if (state.current && state.current.id === id) state.current = null;
      saveSessions(); render();
    } else {
      btn.dataset.armed = '1'; btn.textContent = 'Tap again';
      setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = 'Delete'; } }, 2500);
    }
  }
});
$('#history').addEventListener('change', (e) => {
  if (e.target.dataset.act !== 'note') return;
  const s = state.sessions.find((x) => x.id === e.target.closest('[data-id]').dataset.id);
  if (s) { s.note = e.target.value; saveSessions(); render(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.device && state.device.gatt.connected) keepAwake();
});

// The WebBLE extension may inject its API after page load, so check again shortly
function checkBle() {
  const ble = getBle();
  $('#noBle').hidden = !!ble;
  return ble;
}
if (!checkBle()) setTimeout(() => { if (!checkBle()) log('No Bluetooth API (navigator.bluetooth / beacio / webble)', 'err'); else log('Bluetooth API appeared: ' + bleName(), 'ok'); }, 1500);
else log('Bluetooth API: ' + bleName());
loadSessions();
state.current = state.sessions.find((s) => !s.endedAt && s.shots.length) || null;
render();
log('Ready');
// Exposed for debugging only
window.ShotTimer = { feed: feed, state: state };
})();
</script>
